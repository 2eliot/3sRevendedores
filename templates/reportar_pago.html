<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reportar pago</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='theme.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='ui.css') }}">
  <script src="{{ url_for('static', filename='theme-init.js') }}"></script>
  <link rel="stylesheet" href="{{ brand_css_url() }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='themes.css') }}">
  <style>
    .rp-wrap { max-width: 460px; margin: 0 auto; padding: 24px 16px 64px; }
    .rp-wrap h1 { margin: 16px 0 4px; font-size: 24px; font-weight: 600; }
    .rp-lead { margin: 0 0 16px; color: var(--rc-ash); font-size: 14px; line-height: 1.5; }
    .rp-card { background: var(--rc-card); border: 1px solid var(--rc-border); border-radius: 14px; padding: 18px; }
    .rp-card label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--rc-ash); margin-bottom: 14px; }
    .rp-card input { min-height: 44px; padding: 0 12px; border-radius: 10px; font-size: 15px; }
    .rp-card small { color: var(--rc-ash); font-size: 12px; }
    .rp-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .rp-btn { width: 100%; min-height: 46px; border-radius: 10px; border: 0; font-weight: 600; font-size: 15px; cursor: pointer; background: var(--rc-mist); color: var(--rc-card); }
    .rp-btn[disabled] { opacity: .6; cursor: progress; }
    .rp-res { margin-top: 14px; padding: 12px 14px; border-radius: 10px; font-size: 14px; line-height: 1.5; display: none; }
    .rp-res.ok { display: block; background: var(--rc-green-bg); color: var(--rc-green); }
    .rp-res.err { display: block; background: rgba(var(--rc-ink), .05); border: 1px solid var(--rc-coral); color: var(--rc-text); }
    .rp-res.warn { display: block; background: var(--rc-yellow-bg); color: var(--rc-yellow); }
    .rp-hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="rp-wrap">
    <a href="/billetera" class="back-button">← Volver a Billetera</a>
    <h1>Reportar pago</h1>
    <p class="rp-lead">Escribe la referencia y el monto de tu pago móvil o transferencia a Bancamiga. Lo comprobamos con los pagos recibidos en el banco.</p>

    <form class="rp-card" id="rp-form" novalidate>
      <label>Referencia
        <input type="text" name="referencia" inputmode="numeric" autocomplete="off" maxlength="30" required placeholder="Ej: 7568126123">
        <small>Mínimo 4 dígitos. Con 6 o más basta la referencia y el monto.</small>
      </label>
      <label>Monto (Bs)
        <input type="text" name="monto" inputmode="decimal" autocomplete="off" required placeholder="Ej: 7350,00">
      </label>
      <div class="rp-row">
        <label id="rp-fecha-l">Fecha del pago
          <input type="date" name="fecha" max="{{ hoy }}">
        </label>
        <label id="rp-hora-l" class="rp-hidden">Hora del pago
          <input type="time" name="hora" step="1">
        </label>
      </div>
      <button type="submit" class="rp-btn" id="rp-btn">Verificar pago</button>
      <div class="rp-res" id="rp-res" role="status" aria-live="polite"></div>
    </form>
  </div>

  <script>
    var f = document.getElementById('rp-form'), res = document.getElementById('rp-res'), btn = document.getElementById('rp-btn');
    f.referencia.addEventListener('input', function () { this.value = this.value.replace(/\D/g, ''); });
    function mostrar(tipo, texto) { res.className = 'rp-res ' + tipo; res.textContent = texto; }

    f.addEventListener('submit', async function (e) {
      e.preventDefault();
      var ref = f.referencia.value.replace(/^0+/, '');
      if (ref.length < 4) { mostrar('err', 'La referencia debe tener al menos 4 dígitos.'); return; }
      if (!f.monto.value.trim()) { mostrar('err', 'Escribe el monto del pago.'); return; }
      if (ref.length < 6 && !f.fecha.value) { mostrar('warn', 'Con 4 o 5 dígitos indica también la fecha del pago.'); f.fecha.focus(); return; }
      btn.disabled = true; btn.textContent = 'Verificando…';
      try {
        var r = await fetch('/api/verificar-pago', {method: 'POST', headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({referencia: f.referencia.value, monto: f.monto.value, fecha: f.fecha.value || null, hora: f.hora.value || null})});
        var d = {}; try { d = await r.json(); } catch (x) {}
        var c = d.codigo;
        if (d.ok) {
          mostrar('ok', '✓ ' + (d.mensaje || 'Pago verificado') + (d.pago ? ': Bs ' + Number(d.pago.monto).toLocaleString('es-VE', {minimumFractionDigits: 2}) + ' del ' + d.pago.fecha : '') + '.');
          f.reset(); document.getElementById('rp-hora-l').classList.add('rp-hidden');
        } else if (d.pedir_hora) {
          document.getElementById('rp-hora-l').classList.remove('rp-hidden');
          mostrar('warn', d.mensaje); f.hora.focus();
        } else if (c === 'falta_fecha') {
          mostrar('warn', d.mensaje); f.fecha.focus();
        } else if (c === 'no_encontrado' || c === 'revision') {
          mostrar('warn', d.mensaje || 'No se pudo verificar.');
        } else {
          mostrar('err', d.mensaje || d.error || 'No se pudo verificar el pago.');
        }
      } catch (x) {
        mostrar('err', 'Error de conexión. Inténtalo de nuevo.');
      } finally {
        btn.disabled = false; btn.textContent = 'Verificar pago';
      }
    });
  </script>
</body>
</html>
